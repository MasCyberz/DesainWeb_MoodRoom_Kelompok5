<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Profil | MoodRoom</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="search" role="search">
      <i class="bi bi-search"></i>
      <input type="search" placeholder="Cari Lagu, Artis, MoodCard, atau Profil User" aria-label="Cari">
      <span class="filter"><i class="bi bi-chevron-down"></i> Filter</span>
    </div>
    <div class="page-head"><a class="back" href="index.html" aria-label="Kembali"><i class="bi bi-arrow-left"></i></a><h2>Edit Profil</h2></div>
    <p class="page-sub">Ubah informasi profil kamu agar lebih dikenal oleh teman-teman di MoodRoom.</p>

    <form data-profile-form data-redirect="index.html" novalidate>
      <div class="form-grid">
        <div class="photo-col">
          <div class="photo-wrap">
            <div class="avatar lg">D<img data-avatar src="img/avatar.jpg" alt="Foto profil" onerror="this.style.display='none'"></div>
            <span class="cam"><i class="bi bi-camera-fill"></i></span>
          </div>
          <label class="btn btn-purple" for="photo-input" style="cursor:pointer"><i class="bi bi-camera"></i> Ganti Foto</label>
          <input type="file" id="photo-input" class="sr-only" accept="image/png,image/jpeg">
          <small>Format gambar: JPG, PNG. Maks. 3 MB</small>
        </div>
        <div class="fields">
          <div class="field">
            <label for="f-name">Nama Tampilan</label>
            <div class="input-wrap"><input class="input" id="f-name" data-field="name" maxlength="30" required><span class="counter" data-counter="f-name"></span></div>
            <div class="error" data-error="name"></div>
          </div>
          <div class="field">
            <label for="f-user">Username</label>
            <div class="input-wrap"><input class="input" id="f-user" data-field="username" maxlength="20" required><span class="counter" data-counter="f-user"></span></div>
            <div class="error" data-error="username"></div>
          </div>
          <div class="field">
            <label for="f-bio">Bio</label>
            <div class="input-wrap"><textarea class="textarea" id="f-bio" data-field="bio" maxlength="150"></textarea><span class="counter" data-counter="f-bio"></span></div>
          </div>
          <div class="field">
            <label for="f-loc">Lokasi (Opsional)</label>
            <div class="input-wrap"><input class="input" id="f-loc" data-field="location" maxlength="40"></div>
          </div>
        </div>
      </div>

      <div class="pref">
        <h5>Preferensi</h5>
        <p>Pilih suasana hati yang paling menggambarkan dirimu (opsional).</p>
        <div class="chips">
          <button type="button" class="chip" data-mood="Galau">😔 Galau</button>
          <button type="button" class="chip" data-mood="Santai">🎵 Santai</button>
          <button type="button" class="chip" data-mood="Fokus">🎧 Fokus</button>
          <button type="button" class="chip" data-mood="Semangat">🔥 Semangat</button>
        </div>
      </div>

      <div class="form-actions">
        <a class="btn btn-dark" href="index.html">Batal</a>
        <button class="btn btn-pink" type="submit">Simpan Perubahan</button>
      </div>
    </form>
  </main>
  <aside class="rightbar" id="rightbar"></aside>
  <footer class="player" id="player"></footer>
</div>

<script src="js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — MoodRoom</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
</head>
<body class="auth-page" data-auth-page="guest">
  <main class="auth-shell">
    <section class="auth-showcase">
      <div class="auth-brand"><i class="bi bi-music-note-beamed"></i> MoodRoom</div>
      <div class="auth-showcase-content">
        <h1>Musik untuk setiap suasana.</h1>
        <p>Masuk untuk mendengarkan, menyimpan mood, dan berbagi lagu bersama teman.</p>
      </div>
    </section>

    <section class="auth-panel-wrap">
      <form class="auth-card" id="loginForm">
        <h2>Selamat datang</h2>
        <p class="auth-subtitle">Masuk ke akun MoodRoom kamu</p>

        <div class="auth-field">
          <label for="loginUsername">Username atau Email</label>
          <input class="auth-input" id="loginUsername" type="text" placeholder="Masukkan username atau email" required>
        </div>

        <div class="auth-field">
          <label for="loginPassword">Password</label>
          <div class="auth-password">
            <input class="auth-input" id="loginPassword" type="password" placeholder="Masukkan password" minlength="6" required>
            <button class="auth-password-toggle" type="button" data-toggle-password="loginPassword" aria-label="Tampilkan password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-options">
          <label class="auth-check"><input id="rememberLogin" type="checkbox"> Ingat saya</label>
          <a class="auth-link" href="#" id="forgotLink">Lupa password?</a>
        </div>

        <button class="auth-button" type="submit">Masuk</button>
        <div class="auth-divider">atau</div>
        <div class="auth-switch">Belum punya akun? <a class="auth-link" href="register.html">Daftar sekarang</a></div>
        <p class="auth-error" id="loginError" role="alert"></p>
      </form>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script>
    (() => {
      const form = document.getElementById('loginForm');
      const error = document.getElementById('loginError');

      document.querySelectorAll('[data-toggle-password]').forEach(button => {
        button.addEventListener('click', () => {
          const input = document.getElementById(button.dataset.togglePassword);
          const icon = button.querySelector('i');
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
      });

      document.getElementById('forgotLink').addEventListener('click', event => {
        event.preventDefault();
        error.textContent = 'Fitur pemulihan password akan segera tersedia.';
      });

      form.addEventListener('submit', event => {
        event.preventEvent?.();
        event.preventDefault();
        const login = document.getElementById('loginUsername').value.trim().toLowerCase();
        const password = document.getElementById('loginPassword').value;
        const users = MoodAuth.getUsers();
        const user = users.find(item =>
          (item.username.toLowerCase() === login || item.email.toLowerCase() === login) &&
          item.password === password
        );

        if (!user) {
          error.textContent = 'Username/email atau password salah.';
          return;
        }

        MoodAuth.login({
          name: user.name,
          username: user.username,
          email: user.email,
          remember: document.getElementById('rememberLogin').checked
        });

        localStorage.setItem('moodroom_profile', JSON.stringify({
          name: user.name,
          username: user.username,
          email: user.email,
          location: 'Indonesia',
          bio: 'Mengumpulkan lagu dan MoodCard sesuai suasana hati',
          joined: '12 Jan 2025',
          avatar: 'img/dimas_avatar.png'
        }));
        location.replace('index.html');
      });
    })();
  </script>
</body>
</html>
